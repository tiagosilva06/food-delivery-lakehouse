[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "food-delivery-lakehouse"
version = "0.1.0"
description = "Local, production-inspired streaming and batch data platform for food delivery."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis",
    "jsonschema",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/food_delivery_lakehouse"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "spark", "airflow"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

